worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # =========================================================================
    # RATE LIMITING & DDOS PROTECTION
    # =========================================================================
    # Limit general requests to 20 requests/second per IP with burst of 40
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    
    # Limit sensitive endpoints to 5 requests/second per IP with burst of 10
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=5r/s;

    # Limit maximum concurrent connections per IP address to 25
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Buffer size boundaries against buffer-overflow exploits
    client_body_buffer_size 128k;
    client_max_body_size 12M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # =========================================================================
    # GZIP COMPRESSION
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Rate limiting applied to all requests
        limit_req zone=general_limit burst=30 nodelay;
        limit_conn conn_limit 25;

        # =====================================================================
        # SECURITY RESPONSE HEADERS (OWASP RECOMMENDED)
        # =====================================================================
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # =====================================================================
        # STATIC ASSETS CACHING (1 Year immutable for hashed files)
        # =====================================================================
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|webp|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Healthcheck endpoint for Docker / Load Balancers
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"campus-finder","timestamp":"$time_iso8601"}';
        }

        # SPA Fallback (All HTML requests route to index.html with no-cache)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Custom Error Pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
